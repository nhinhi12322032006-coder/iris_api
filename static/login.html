<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập · Iris Studio</title>
    <link rel="stylesheet" href="/static/css/style.css?v=auth-responsive-4">
</head>
<body>
    <main id="auth-overlay" class="auth-overlay">
        <div class="auth-layout">
            <section class="auth-intro" aria-label="Giới thiệu Iris Studio">
                <div class="auth-brand">
                    <span class="auth-brand-icon">✿</span>
                    <span>Iris Studio</span>
                </div>

                <div class="auth-intro-content">
                    <span class="auth-eyebrow">KHÁM PHÁ DỮ LIỆU HOA IRIS</span>
                    <h1>Mỗi bông hoa là một câu chuyện dữ liệu.</h1>
                    <div class="auth-flower" aria-hidden="true">✿</div>
                </div>

                <span class="auth-intro-footer">
                    IRIS STUDIO · KHOA HỌC DỮ LIỆU
                </span>
            </section>

            <section class="auth-card" aria-labelledby="auth-title">
                <div class="auth-card-inner">
                    <span class="auth-card-mark" aria-hidden="true">✿</span>
                    <span class="auth-card-eyebrow">CHÀO MỪNG BẠN</span>

                    <h2 id="auth-title">Đăng nhập</h2>
                    <p id="auth-subtitle">
                        Đăng nhập để bắt đầu sử dụng Iris Studio.
                    </p>

                    <form id="auth-form">

                        <div class="form-group" id="login-username-field" hidden>
                            <label for="auth-username">
                                Tên đăng nhập
                            </label>
                    
                            <input
                                id="auth-username"
                                type="text"
                                autocomplete="username"
                                placeholder="Nhập tên đăng nhập"
                            >
                        </div>
                    
                    
                        <div class="form-group" id="login-email-field" hidden>
                            <label for="auth-login-email">
                                Email
                            </label>
                    
                            <input
                                id="auth-login-email"
                                type="email"
                                autocomplete="email"
                                placeholder="Nhập địa chỉ email"
                                oninvalid="this.setCustomValidity('Email không hợp lệ. Vui lòng kiểm tra lại.')"
                                oninput="this.setCustomValidity('')"
                            >
                        </div>
                    
                    
                        <div class="form-group" id="register-fields" hidden>
                            <label for="auth-email">
                                Email
                            </label>
                    
                            <input
                                id="auth-email"
                                type="email"
                                autocomplete="email"
                                placeholder="Nhập địa chỉ email"
                                oninvalid="this.setCustomValidity('Email không hợp lệ. Vui lòng kiểm tra lại.')"
                                oninput="this.setCustomValidity('')"
                            >
                        </div>
                    
                    
                        <div class="form-group">
                            <label for="auth-password">
                                Mật khẩu
                            </label>
                    
                            <input
                                id="auth-password"
                                type="password"
                                autocomplete="current-password"
                                placeholder="Nhập mật khẩu"
                                required
                            >
                        </div>
                    
                    
                        <button id="auth-submit" type="submit">
                            Đăng nhập
                        </button>
                    
                    </form>

                    <p id="auth-message" role="status" aria-live="polite"></p>

                    <button id="auth-switch" type="button">
                        Chưa có tài khoản? Đăng ký
                    </button>
                </div>
            </section>
        </div>
    </main>

    <script src="/static/js/auth.js?v=auth-separate-1"></script>
</body>
</html>
