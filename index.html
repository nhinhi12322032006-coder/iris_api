<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dự đoán loài hoa Iris - Phiên bản Sáng tạo</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #a8ff78, #78ffd6);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            width: 380px;
            transition: all 0.3s ease;
        }
        h2 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 25px;
            font-size: 24px;
        }
        .input-group {
            margin-bottom: 15px;
        }
        .input-group label {
            display: block;
            margin-bottom: 6px;
            color: #34495e;
            font-weight: 600;
            font-size: 14px;
        }
        .input-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        .input-group input:focus {
            border-color: #2ecc71;
            outline: none;
        }
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #11998e, #38ef7d);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(56, 239, 125, 0.3);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(56, 239, 125, 0.4);
        }
        .result-box {
            margin-top: 25px;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
            display: none;
            animation: fadeIn 0.5s ease-in-out;
        }
        .success {
            background-color: #ebfbee;
            color: #1b5e20;
            border: 1px solid #c3e6cb;
        }
        .flower-img {
            width: 100%;
            max-height: 200px;
            object-fit: cover;
            border-radius: 8px;
            margin-top: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .flower-desc {
            font-size: 13px;
            color: #555;
            font-weight: normal;
            margin-top: 8px;
            line-height: 1.4;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Dự đoán hoa Iris 🌸</h2>
    
    <div class="input-group">
        <label>Chiều dài lá đài (Sepal Length):</label>
        <input type="number" id="sepal_length" step="0.1" value="5.1">
    </div>
    <div class="input-group">
        <label>Chiều rộng lá đài (Sepal Width):</label>
        <input type="number" id="sepal_width" step="0.1" value="3.5">
    </div>
    <div class="input-group">
        <label>Chiều dài cánh hoa (Petal Length):</label>
        <input type="number" id="petal_length" step="0.1" value="1.4">
    </div>
    <div class="input-group">
        <label>Chiều rộng cánh hoa (Petal Width):</label>
        <input type="number" id="petal_width" step="0.1" value="0.2">
    </div>

    <button onclick="predictFlower()">Phân tích & Dự đoán</button>

    <div id="result" class="result-box success"></div>
</div>

<script>
    // Kho dữ liệu hình ảnh và mô tả để tăng tính bứt phá cho đồ án
    const flowerData = {
        "setosa": {
            img: "https://wikimedia.org",
            desc: "💡 Hoa diên vĩ Setosa thường có lá đài lớn, cánh hoa nhỏ. Đây là loài hoa rất dễ nhận biết với kích thước cánh hoa ngắn đặc trưng."
        },
        "versicolor": {
            img: "https://wikimedia.org",
            desc: "💡 Hoa diên vĩ Versicolor (Xanh mượt) có màu sắc pha trộn giữa xanh lam, tím và vàng. Kích thước các bộ phận ở mức trung bình."
        },
        "virginica": {
            img: "https://wikimedia.org",
            desc: "💡 Hoa diên vĩ Virginica sở hữu cánh hoa dài và lớn nhất trong 3 loại, màu sắc tím đậm quý phái, thường sống ở vùng ẩm ướt."
        }
    };

    function predictFlower() {
        const resultBox = document.getElementById("result");
        resultBox.style.display = "block";
        resultBox.innerHTML = "⏳ Đang kết nối server và phân tích...";

        fetch("https://onrender.com", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                sepal_length: parseFloat(document.getElementById("sepal_length").value),
                sepal_width: parseFloat(document.getElementById("sepal_width").value),
                petal_length: parseFloat(document.getElementById("petal_length").value),
                petal_width: parseFloat(document.getElementById("petal_width").value)
            })
        })
        .then(response => response.json())
        .then(data => {
            const name = data.prediction.toLowerCase();
            const info = flowerData[name];

            // Đổ dữ liệu ảnh, chữ và hiệu ứng sáng tạo ra màn hình
            resultBox.innerHTML = `
                <div>✨ Kết quả: <b style="font-size: 18px; color: #2ecc71;">${name.toUpperCase()}</b> (ID: ${data.class_id})</div>
                <img class="flower-img" src="${info.img}" alt="${name}">
                <div class="flower-desc">${info.desc}</div>
            `;
        })
        .catch(error => {
            resultBox.innerHTML = "❌ Lỗi kết nối đến API! Hãy dùng dấu chấm '.' thay vì dấu phẩy.";
            console.error(error);
        });
    }
</script>

</body>
</html>
