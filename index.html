<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dự đoán loài hoa Iris - AI Nâng Cao</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #e0f7fa 0%, #e8f5e9 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background-color: #ffffff;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            width: 380px;
            box-sizing: border-box;
        }
        h2 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 25px;
            font-weight: 700;
        }
        .input-group {
            margin-bottom: 18px;
        }
        .input-group label {
            display: block;
            margin-bottom: 6px;
            color: #4a5568;
            font-weight: 600;
            font-size: 14px;
        }
        .input-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        .input-group input:focus {
            border-color: #2ecc71;
            outline: none;
        }
        button {
            width: 100%;
            padding: 14px;
            background-color: #3caea3; /* Giữ tông màu xanh ngọc giống ảnh chụp của bạn */
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(60, 174, 163, 0.2);
        }
        button:hover {
            background-color: #2f8980;
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(60, 174, 163, 0.3);
        }
        .result-container {
            margin-top: 25px;
            display: none;
            animation: fadeIn 0.6s ease-in-out forwards;
        }
        .result-box {
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
            font-size: 16px;
            background-color: #e8f5e9;
            color: #2e7d32;
            border: 1px solid #c8e6c9;
            margin-bottom: 15px;
        }
        .flower-image {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            border: 2px solid #fff;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Dự đoán hoa Iris 🌸</h2>
    
    <div class="input-group">
        <label>Chiều dài lá đài (Sepal Length):</label>
        <input type="number" id="sepal_length" step="0.1" value="5.1">
    </div>
    <div class="input-group">
        <label>Chiều rộng lá đài (Sepal Width):</label>
        <input type="number" id="sepal_width" step="0.1" value="3.5">
    </div>
    <div class="input-group">
        <label>Chiều dài cánh hoa (Petal Length):</label>
        <input type="number" id="petal_length" step="0.1" value="1.4">
    </div>
    <div class="input-group">
        <label>Chiều rộng cánh hoa (Petal Width):</label>
        <input type="number" id="petal_width" step="0.1" value="0.2">
    </div>

    <button onclick="predictFlower()">Bấm để dự đoán</button>

    <!-- KHU VỰC CHỨA CẢ CHỮ VÀ ẢNH ĐƯỢC ẨN ĐI, CHỈ HIỆN KHI CÓ KẾT QUẢ -->
    <div id="resultContainer" class="result-container">
        <div id="resultText" class="result-box"></div>
        <img id="flowerImg" class="flower-image" src="" alt="Hình ảnh hoa Iris thực tế">
    </div>
</div>

<script>
    // Bản đồ chứa link ảnh trực tuyến tốc độ cao và cực kỳ ổn định
    const flowerImages = {
        "setosa": "https://apc.edu.vn",
        "versicolor": "https://apc.edu.vn",
        "virginica": "https://apc.edu.vn"
    };

    function predictFlower() {
        const resultContainer = document.getElementById("resultContainer");
        const resultText = document.getElementById("resultText");
        const flowerImg = document.getElementById("flowerImg");
        
        resultContainer.style.display = "block";
        flowerImg.style.display = "none"; // Tạm thời ẩn khung ảnh khi đang gọi API
        resultText.innerHTML = "⏳ Đang kết nối mạng và phân tích AI...";

        // Kết nối thẳng tới domain Render cá nhân của bạn
        fetch("https://onrender.com", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                sepal_length: parseFloat(document.getElementById("sepal_length").value),
                sepal_width: parseFloat(document.getElementById("sepal_width").value),
                petal_length: parseFloat(document.getElementById("petal_length").value),
                petal_width: parseFloat(document.getElementById("petal_width").value)
            })
        })
        .then(response => response.json())
        .then(data => {
            const predName = data.prediction.toLowerCase();
            
            // 1. Cập nhật dòng chữ thông báo kết quả giống định dạng cũ của bạn
            resultText.innerHTML = `Kết quả: ${data.prediction.toUpperCase()} (ID: ${data.class_id})`;
            
            // 2. Tự động kiểm tra bản đồ và đính kèm bức ảnh hoa lung linh vào dưới
            if (flowerImages[predName]) {
                flowerImg.src = flowerImages[predName];
                flowerImg.style.display = "block";
            }
        })
        .catch(error => {
            resultText.innerHTML = "❌ Lỗi kết nối đến API!";
            console.error(error);
        });
    }
</script>

</body>
</html>
