<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dự đoán hoa Iris</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f4f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 400px;
        }

        h2 {
            text-align: center;
            color: #2c3e50;
            margin-top: 0;
            margin-bottom: 25px;
            font-size: 24px;
        }

        .slider-group {
            margin-bottom: 20px;
        }

        .slider-label {
            display: flex;
            justify-content: space-between;
            font-weight: 600;
            color: #4a5568;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .slider-value {
            color: #319795;
            background: #e6fffa;
            padding: 2px 8px;
            border-radius: 6px;
        }

        input[type="range"] {
            width: 100%;
            -webkit-appearance: none;
            height: 8px;
            border-radius: 4px;
            background: #e2e8f0;
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #319795;
            cursor: pointer;
            transition: transform 0.1s;
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        .result-box {
            margin-top: 25px;
            padding: 15px;
            border-radius: 12px;
            background: #f7fafc;
            border: 1px dashed #cbd5e0;
            text-align: center;
            min-height: 50px;
        }

        .prediction-text {
            font-size: 18px;
            font-weight: bold;
            color: #2b6cb0;
            margin: 0;
        }

        .loading {
            color: #a0aec0;
            font-style: italic;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>Dự đoán hoa Iris 🌸</h2>

    <!-- Sepal Length -->
    <div class="slider-group">
        <div class="slider-label">
            <span>Chiều dài lá đài (Sepal Length)</span>
            <span class="slider-value" id="val-sepal-len">5.1</span>
        </div>
        <input type="range" id="sepal-len" min="4.0" max="8.0" step="0.1" value="5.1">
    </div>

    <!-- Sepal Width -->
    <div class="slider-group">
        <div class="slider-label">
            <span>Chiều rộng lá đài (Sepal Width)</span>
            <span class="slider-value" id="val-sepal-wid">3.5</span>
        </div>
        <input type="range" id="sepal-wid" min="2.0" max="4.5" step="0.1" value="3.5">
    </div>

    <!-- Petal Length -->
    <div class="slider-group">
        <div class="slider-label">
            <span>Chiều dài cánh hoa (Petal Length)</span>
            <span class="slider-value" id="val-petal-len">1.4</span>
        </div>
        <input type="range" id="petal-len" min="1.0" max="7.0" step="0.1" value="1.4">
    </div>

    <!-- Petal Width -->
    <div class="slider-group">
        <div class="slider-label">
            <span>Chiều rộng cánh hoa (Petal Width)</span>
            <span class="slider-value" id="val-petal-wid">0.2</span>
        </div>
        <input type="range" id="petal-wid" min="0.1" max="2.5" step="0.1" value="0.2">
    </div>

    <!-- Kết quả dự đoán -->
    <div class="result-box">
        <p class="prediction-text" id="result">Kéo thanh trượt để dự đoán</p>
    </div>
</div>

<script>
    // Lấy các phần tử DOM
    const sliders = {
        'sepal-len': document.getElementById('sepal-len'),
        'sepal-wid': document.getElementById('sepal-wid'),
        'petal-len': document.getElementById('petal-len'),
        'petal-wid': document.getElementById('petal-wid')
    };

    const labels = {
        'sepal-len': document.getElementById('val-sepal-len'),
        'sepal-wid': document.getElementById('val-sepal-wid'),
        'petal-len': document.getElementById('val-petal-len'),
        'petal-wid': document.getElementById('val-petal-wid')
    };

    const resultBox = document.getElementById('result');
    let debounceTimer;

    // Hàm gửi dữ liệu lên API
    async function fetchPrediction() {
        resultBox.className = "loading";
        resultBox.innerText = "Đang tính toán...";

        const data = {
            sepal_length: parseFloat(sliders['sepal-len'].value),
            sepal_width: parseFloat(sliders['sepal-wid'].value),
            petal_length: parseFloat(sliders['petal-len'].value),
            petal_width: parseFloat(sliders['petal-wid'].value)
        };

        try {
            const response = await fetch("https://iris-api-5jf3.onrender.com/predict", {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(data)
            });

            if (!response.ok) throw new Error('Lỗi kết nối API');
            
            const result = await response.json();
            
            // Hiển thị kết quả (Giả định API trả về key "prediction")
            resultBox.className = "prediction-text";
            resultBox.innerText = `Kết quả: ${result.prediction || JSON.stringify(result)}`;
        } catch (error) {
            resultBox.className = "";
            resultBox.style.color = "red";
            resultBox.innerText = "Không thể kết nối đến API server!";
        }
    }

    // Lắng nghe sự kiện kéo thanh trượt
    Object.keys(sliders).forEach(key => {
        sliders[key].addEventListener('input', (e) => {
            // Cập nhật số hiển thị ngay lập tức khi kéo
            labels[key].innerText = e.target.value;

            // Debounce: Chờ người dùng dừng kéo 300ms mới gọi API để tránh quá tải
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(fetchPrediction, 300);
        });
    });

    // Chạy dự đoán lần đầu tiên khi vừa tải trang
    fetchPrediction();
</script>

</body>
</html>
